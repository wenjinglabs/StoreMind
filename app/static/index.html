<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoreMind · 门店运营知识库 Agent</title>
<style>
  :root {
    --bg: #FAFAF7;
    --panel: #FFFFFF;
    --border: #E5E3DC;
    --border-strong: #D3D1C7;
    --text: #2C2C2A;
    --muted: #5F5E5A;
    --hint: #8A8880;
    --accent: #185FA5;
    --accent-bg: #E6F1FB;
    --green: #0F6E56;
    --green-bg: #E1F5EE;
    --amber: #854F0B;
    --amber-bg: #FAEEDA;
    --coral: #993C1D;
    --coral-bg: #FAECE7;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(44,44,42,.04), 0 4px 16px rgba(44,44,42,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 920px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(250,250,247,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  .brand h1 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .brand .sub { font-size: 12px; color: var(--hint); }
  .status { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border-strong); color: var(--muted); background: var(--panel);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .pill.ok { border-color: #B7DEC9; background: var(--green-bg); color: var(--green); }
  .pill.warn { border-color: #F0D28A; background: var(--amber-bg); color: var(--amber); }
  .pill.btn { cursor: pointer; }
  .pill.btn:hover { border-color: var(--accent); color: var(--accent); }

  main { flex: 1; padding: 26px 20px 12px; }

  .empty { text-align: center; padding: 46px 12px 30px; }
  .empty h2 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 10px; }
  .empty p { color: var(--muted); font-size: 14px; max-width: 560px; margin: 0 auto 26px; }
  .examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; max-width: 720px; margin: 0 auto; }
  .ex {
    text-align: left; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 15px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    font-family: inherit; font-size: 14px; color: var(--text);
  }
  .ex:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
  .ex .tag { display: block; font-size: 11px; color: var(--hint); margin-bottom: 4px; font-weight: 500; }

  .msg { margin-bottom: 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--accent-bg); border: 1px solid #C9DEF5; color: #123A63;
    padding: 10px 15px; border-radius: var(--radius); max-width: 78%;
    border-bottom-right-radius: 4px; font-size: 14.5px;
  }
  .msg.bot .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); border-top-left-radius: 4px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }

  .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 11px; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
    letter-spacing: .01em;
  }
  .badge.policy { background: var(--green-bg); color: var(--green); }
  .badge.data { background: var(--amber-bg); color: var(--amber); }
  .badge.both { background: var(--accent-bg); color: var(--accent); }
  .badge.retry { background: var(--coral-bg); color: var(--coral); }
  .badge.selfcheck { background: #F1EFE8; color: var(--muted); }
  .route-note { font-size: 11.5px; color: var(--hint); }

  .answer { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .answer .cite {
    color: var(--accent); font-weight: 600; cursor: pointer;
    font-size: 11px; vertical-align: super; padding: 0 1px;
  }
  .answer .cite:hover { text-decoration: underline; }
  .answer strong { font-weight: 600; }
  .answer .section-h { font-weight: 600; display: block; margin: 10px 0 4px; }
  .answer .note { color: var(--hint); font-size: 12.5px; font-style: italic; }

  details.panel { margin-top: 13px; border-top: 1px solid var(--border); padding-top: 11px; }
  details.panel > summary {
    cursor: pointer; font-size: 12.5px; color: var(--accent); font-weight: 500;
    list-style: none; display: flex; align-items: center; gap: 6px; user-select: none;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::before {
    content: "▸"; font-size: 10px; transition: transform .15s; display: inline-block;
  }
  details.panel[open] > summary::before { transform: rotate(90deg); }
  details.panel > summary:hover { text-decoration: underline; }
  .panel-body { margin-top: 13px; display: flex; flex-direction: column; gap: 16px; }

  .block-label {
    font-size: 11px; font-weight: 600; color: var(--hint); letter-spacing: .06em;
    text-transform: uppercase; margin-bottom: 8px;
  }

  .trace { display: flex; flex-direction: column; gap: 0; }
  .step { display: grid; grid-template-columns: 92px 54px 1fr; gap: 10px; align-items: baseline; padding: 5px 0; font-size: 12.5px; }
  .step + .step { border-top: 1px dashed var(--border); }
  .step .n { font-weight: 600; color: var(--muted); font-family: ui-monospace, "Cascadia Code", monospace; font-size: 11.5px; }
  .step .ms { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 11.5px; text-align: right; }
  .step .d { color: var(--muted); word-break: break-word; }
  .step-judge .n { color: var(--coral); }
  .step-judge .d { color: var(--coral); }
  .step-rewrite .n { color: var(--amber); }
  .step-rewrite .d { color: var(--amber); }

  .cites { display: flex; flex-direction: column; gap: 9px; }
  .cite-card {
    border: 1px solid var(--border); border-radius: 9px; overflow: hidden;
    background: #FDFDFB; transition: border-color .15s;
  }
  .cite-card.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .cite-head {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px; cursor: pointer;
    font-size: 12.5px;
  }
  .cite-head:hover { background: #F7F6F1; }
  .cite-idx {
    flex: 0 0 auto; width: 19px; height: 19px; border-radius: 5px;
    background: var(--accent-bg); color: var(--accent); font-size: 11px; font-weight: 600;
    display: grid; place-items: center;
  }
  .cite-path { flex: 1; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cite-doc { color: var(--hint); font-size: 11.5px; }
  .cite-score {
    flex: 0 0 auto; font-variant-numeric: tabular-nums; font-size: 11px;
    color: var(--green); background: var(--green-bg); padding: 2px 7px; border-radius: 5px;
  }
  .cite-body { padding: 0 12px 11px; font-size: 12.5px; color: var(--muted); display: none; white-space: pre-wrap; }
  .cite-card.open .cite-body { display: block; }

  .datatable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .datatable th, .datatable td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .datatable th { color: var(--hint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .datatable td { color: var(--text); font-variant-numeric: tabular-nums; }
  .datatable tr:last-child td { border-bottom: none; }
  .datatable .row-tag { color: var(--accent); font-weight: 600; font-size: 11px; white-space: nowrap; }
  .datatable tr.flash-row td { background: var(--accent-bg); }
  .datatable tr.flash-row .row-tag { color: var(--accent); }
  .tool-note { font-size: 11.5px; color: var(--hint); margin-top: 6px; }
  .cite.cite-data { color: var(--green); }

  .thinking { display: flex; align-items: center; gap: 8px; color: var(--hint); font-size: 13.5px; padding: 6px 0; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    animation: bob 1.1s infinite ease-in-out;
  }
  .dots i:nth-child(2) { animation-delay: .16s; }
  .dots i:nth-child(3) { animation-delay: .32s; }
  @keyframes bob { 0%,80%,100% { opacity:.25; transform: translateY(0);} 40% { opacity:1; transform: translateY(-3px);} }

  footer {
    position: sticky; bottom: 0; background: rgba(250,250,247,.95);
    backdrop-filter: blur(8px); border-top: 1px solid var(--border);
    padding: 13px 20px 17px;
  }
  .composer {
    display: flex; gap: 9px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: var(--radius); padding: 8px 8px 8px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  #q {
    flex: 1; border: none; outline: none; resize: none; font-family: inherit;
    font-size: 14.5px; line-height: 1.55; color: var(--text); background: transparent;
    max-height: 128px; padding: 5px 0;
  }
  #q::placeholder { color: var(--hint); }
  #send {
    flex: 0 0 auto; border: none; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    padding: 8px 17px; border-radius: 8px; cursor: pointer; transition: opacity .15s;
  }
  #send:hover:not(:disabled) { opacity: .88; }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  .foot-hint { font-size: 11.5px; color: var(--hint); margin-top: 8px; text-align: center; }
  .err {
    background: var(--coral-bg); border: 1px solid #EFC3B5; color: var(--coral);
    padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>StoreMind</h1>
      <span class="sub">门店运营知识库 Agent</span>
    </div>
    <div class="status" id="status">
      <span class="pill">连接中…</span>
    </div>
  </header>

  <main id="main">
    <div class="empty" id="empty">
      <h2>问一句，看看它怎么找答案</h2>
      <p>规则在文档里，事实在订单库里。它会先判断你的问题该查哪边，再把答案连同出处一起给你。</p>
      <div class="examples" id="examples"></div>
    </div>
    <div id="thread"></div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="q" rows="1" placeholder="例如：会员卡能跨店用吗"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="foot-hint">Enter 发送 · Shift+Enter 换行 · 同一会话自动继承上文</div>
  </footer>
</div>

<script>
const EXAMPLES = [
  { tag: "查规则", q: "会员卡能跨店用吗" },
  { tag: "查规则", q: "满减和折扣券能一起用吗" },
  { tag: "查规则", q: "客人说酒有异味怎么处理" },
  { tag: "查规则", q: "什么情况必须叫店长" },
  { tag: "查数据", q: "上周广州天河店卖了多少" },
  { tag: "查数据", q: "广州天河店库存告急的有哪些" },
];

const main = document.getElementById("main");
const thread = document.getElementById("thread");
const empty = document.getElementById("empty");
const qEl = document.getElementById("q");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let threadId = sessionStorage.getItem("sm_thread") ||
  ("u-" + Math.random().toString(36).slice(2, 10));
sessionStorage.setItem("sm_thread", threadId);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- 初始化 ---------- */

EXAMPLES.forEach(e => {
  const b = document.createElement("button");
  b.className = "ex";
  b.innerHTML = `<span class="tag">${e.tag}</span>${esc(e.q)}`;
  b.onclick = () => { qEl.value = e.q; send(); };
  document.getElementById("examples").appendChild(b);
});

async function loadStatus() {
  try {
    const r = await fetch("/health");
    const d = await r.json();
    const llmOk = d.llm_backend && d.llm_backend !== "none";
    statusEl.innerHTML = `
      <span class="pill ok">索引 ${d.stats.docs} 篇 / ${d.stats.chunks} 段</span>
      <span class="pill">嵌入 ${esc(d.embed_backend)}</span>
      <span class="pill ${llmOk ? "ok" : "warn"}">生成 ${llmOk ? esc(d.llm_backend) : "抽取式兜底"}</span>
      <span class="pill btn" id="newBtn">新会话</span>`;
    document.getElementById("newBtn").onclick = async () => {
      await fetch("/session/" + encodeURIComponent(threadId), { method: "DELETE" });
      threadId = "u-" + Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem("sm_thread", threadId);
      thread.innerHTML = "";
      empty.style.display = "block";
      loadStatus();
    };
  } catch (e) {
    statusEl.innerHTML = `<span class="pill warn">服务未响应</span>`;
  }
}

/* ---------- 渲染 ---------- */

function renderAnswer(text, cites) {
  let html = esc(text);
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  // 引用角标可点击。
  // 两种编号：[1] 指文档片段（点开看到原文），[D1] 指经营数据行（点开看到工具返回）。
  html = html.replace(/\[(D?\d{1,2})\]/g, (m, n) =>
    `<span class="cite${n[0] === "D" ? " cite-data" : ""}" data-cite="${n}">[${n}]</span>`);
  // 形如「xxx：」的行做小标题
  html = html.replace(/^([^\n：]{2,14}：)$/gm, '<span class="section-h">$1</span>');
  // 兜底提示弱化
  html = html.replace(/（当前未接入生成模型[^）]*）/g, '<span class="note">$&</span>');
  return html;
}

function citeCard(c) {
  const el = document.createElement("div");
  el.className = "cite-card";
  el.dataset.idx = c.index;
  el.innerHTML = `
    <div class="cite-head">
      <span class="cite-idx">${c.index}</span>
      <span class="cite-path">${esc(c.section_path)}</span>
      <span class="cite-doc">${esc(c.doc_title)}</span>
      <span class="cite-score">${Number(c.score).toFixed(4)}</span>
    </div>
    <div class="cite-body">${esc(c.text)}</div>`;
  el.querySelector(".cite-head").onclick = () => el.classList.toggle("open");
  return el;
}

function dataTable(rows) {
  if (!Array.isArray(rows) || !rows.length) return null;
  const cols = Object.keys(rows[0]);
  const t = document.createElement("table");
  t.className = "datatable";
  t.innerHTML = `<thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>` +
    `<tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody>`;
  return t;
}

function renderBot(d) {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";

  const intentLabel = { policy: "规则检索", data: "数据查询", both: "两路并发" };
  const citeList = d.citations || [];
  const tools = d.data || [];
  const trace = d.trace || [];

  // Agent 层的标志：自检没通过时改写检索词重查过。
  // 这是「Agent」和「流水线」最直观的区别，页面上要能看出来。
  const retried = trace.filter(s => s.step === "rewrite").length;
  const judgeSteps = trace.filter(s => s.step === "judge");

  let detailsHtml = "";
  // trace
  detailsHtml += `<div><div class="block-label">执行轨迹</div><div class="trace">` +
    trace.map(s => {
      const cls = s.step === "judge" ? " step-judge" : (s.step === "rewrite" ? " step-rewrite" : "");
      return `<div class="step${cls}"><span class="n">${esc(s.step)}</span><span class="ms">${s.elapsed_ms}ms</span><span class="d">${esc(s.detail)}</span></div>`;
    }).join("") + `</div></div>`;

  const retryBadge = retried > 0
    ? `<span class="badge retry">自检未通过 · 改写重查 ${retried} 次</span>`
    : (judgeSteps.length ? `<span class="badge selfcheck">自检通过</span>` : "");

  wrap.innerHTML = `
    <div class="bubble">
      <div class="meta-row">
        <span class="badge ${d.intent}">${intentLabel[d.intent] || d.intent}</span>
        <span class="route-note">${esc(d.route_reason || "")}</span>
        ${retryBadge}
      </div>
      <div class="answer"></div>
      <details class="panel">
        <summary>查看检索详情（${citeList.length} 条引用${tools.length ? " + " + tools.length + " 次工具调用" : ""}）</summary>
        <div class="panel-body"></div>
      </details>
    </div>`;

  wrap.querySelector(".answer").innerHTML = renderAnswer(d.answer || "", citeList);

  const body = wrap.querySelector(".panel-body");
  const traceBox = document.createElement("div");
  traceBox.innerHTML = detailsHtml;
  body.appendChild(traceBox.firstChild);

  if (tools.length) {
    const blk = document.createElement("div");
    blk.innerHTML = `<div class="block-label">工具调用</div>`;
    tools.forEach(t => {
      const line = document.createElement("div");
      line.className = "tool-note";
      line.textContent = `${t.tool} · ${t.ok ? "成功" : "无数据"} · ${t.note || ""}`;
      blk.appendChild(line);
      const tbl = dataTable(t.data);
      if (tbl) {
        // 给每一行加上 [D1] [D2] 标记，跟答案里的角标对应。
        // 没有这个对应关系，答案里出现 [D3] 时用户点开表格也不知道指哪行。
        const rows = tbl.querySelectorAll("tbody tr");
        rows.forEach((tr, i) => {
          const tag = document.createElement("td");
          tag.className = "row-tag";
          tag.textContent = "[D" + (i + 1) + "]";
          tr.insertBefore(tag, tr.firstChild);
        });
        const head = tbl.querySelector("thead tr");
        if (head) {
          const th = document.createElement("th");
          th.textContent = "编号";
          head.insertBefore(th, head.firstChild);
        }
        blk.appendChild(tbl);
      } else if (t.data) {
        const pre = document.createElement("div");
        pre.className = "tool-note";
        pre.textContent = JSON.stringify(t.data, null, 2);
        blk.appendChild(pre);
      }
    });
    body.appendChild(blk);
  }

  if (citeList.length) {
    const blk = document.createElement("div");
    blk.innerHTML = `<div class="block-label">引用来源（点开看原文）</div>`;
    const box = document.createElement("div");
    box.className = "cites";
    citeList.forEach(c => box.appendChild(citeCard(c)));
    blk.appendChild(box);
    body.appendChild(blk);
  }

  // 角标 → 定位到对应引用卡片
  wrap.querySelectorAll(".cite").forEach(el => {
    el.onclick = () => {
      const idx = el.dataset.cite;
      const panel = wrap.querySelector("details.panel");
      panel.open = true;
      if (idx.startsWith("D")) {
        // 数据引用 [D1] → 定位到工具调用表格的第 1 行
        const n = idx.slice(1);
        const row = wrap.querySelector(`.datatable tbody tr:nth-child(${n})`);
        if (row) {
          row.classList.add("flash-row");
          row.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(() => row.classList.remove("flash-row"), 1600);
        }
        return;
      }
      const card = wrap.querySelector(`.cite-card[data-idx="${idx}"]`);
      if (card) {
        card.classList.add("open", "flash");
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        setTimeout(() => card.classList.remove("flash"), 1600);
      }
    };
  });

  thread.appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  thread.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderThinking() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<div class="bubble"><div class="thinking">
    <span class="dots"><i></i><i></i><i></i></span>
    <span>路由判断 → 检索 / 查库 → 组织答案</span>
  </div></div>`;
  thread.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  return el;
}

/* ---------- 交互 ---------- */

let busy = false;

async function send() {
  const text = qEl.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  empty.style.display = "none";
  qEl.value = "";
  qEl.style.height = "auto";

  renderUser(text);
  const thinking = renderThinking();

  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: text, thread_id: threadId }),
    });
    thinking.remove();
    if (!r.ok) throw new Error("HTTP " + r.status);
    renderBot(await r.json());
  } catch (e) {
    thinking.remove();
    const err = document.createElement("div");
    err.className = "err";
    err.textContent = "请求失败：" + e.message + "（确认后端服务在运行）";
    thread.appendChild(err);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    qEl.focus();
  }
}

sendBtn.onclick = send;
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
qEl.addEventListener("input", () => {
  qEl.style.height = "auto";
  qEl.style.height = Math.min(qEl.scrollHeight, 128) + "px";
});

loadStatus();
qEl.focus();
</script>
</body>
</html>
