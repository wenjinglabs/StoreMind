services:
  # ollama 现在是这套编排的一部分：模型服务不再跑在宿主机上。
  # 模型权重放命名卷，首次启动从宿主机 ~/.ollama/models 导入（见 ollama-import），
  # 避免重复下载已有的模型；之后 ollama-pull 只补缺失的。
  ollama:
    image: ollama/ollama:latest
    container_name: storemind-ollama
    labels:
      com.storemind.name: 模型服务
      com.storemind.desc: ollama（bge-m3 + 生成模型，内部 11434）
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # 跟应用侧一致：模型常驻，避免每次请求重载权重（0.4s → 17s）。
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_models:/root/.ollama/models
    # 给宿主机脚本/调试留一个端口；app/mcp 在容器网络里仍然用 ollama:11434。
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    # 必须等模型导入完成再启动：否则 ollama 会一边被写一边读，
    # 结果是 manifest 在、blob 被截断，表现为「模型突然不见了」。
    depends_on:
      ollama-import:
        condition: service_completed_successfully
    restart: unless-stopped

  # 一次性：把宿主机已有的模型复制进命名卷。
  # 用 .imported 标记判断是否完成过，而不是「目录非空」——
  # ollama 服务启动时会自己建目录，用非空判断会误跳过。
  ollama-import:
    image: alpine:3.20
    container_name: storemind-ollama-import
    labels:
      com.storemind.name: 模型导入
      com.storemind.desc: 从宿主机 ~/.ollama/models 导入（一次性）
    command:
      - sh
      - -c
      - |
        if [ -f /dest/.imported ]; then
          echo "模型卷已导入，跳过";
        elif [ -d /src/manifests ]; then
          echo "导入宿主机模型缓存...";
          cp -a /src/. /dest/ && touch /dest/.imported && echo "导入完成";
        else
          echo "宿主机没有模型缓存，跳过（由 ollama-pull 下载）";
        fi
    volumes:
      - ollama_models:/dest
      - ${USERPROFILE}/.ollama/models:/src:ro
    restart: "no"

  # 一次性：确保编排需要的模型存在。已有则跳过，失败不让整栈起不来。
  ollama-pull:
    image: ollama/ollama:latest
    container_name: storemind-ollama-pull
    labels:
      com.storemind.name: 模型拉取
      com.storemind.desc: 补齐缺失的 bge-m3 / qwen2.5:7b（一次性）
    environment:
      OLLAMA_HOST: http://ollama:11434
      SM_EMBED_MODEL: ${SM_EMBED_MODEL:-bge-m3}
      SM_LLM_MODEL: ${SM_LLM_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in "$$SM_EMBED_MODEL" "$$SM_LLM_MODEL"; do
          if ollama list | awk 'NR>1 {print $$1}' | grep -qx "$$m"; then
            echo "$$m 已存在";
          else
            echo "拉取 $$m ...";
            ollama pull "$$m" || echo "!! 拉取 $$m 失败（检查代理 / Clash fake-IP），应用会自行降级";
          fi
        done;
        exit 0
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: storemind:local
    container_name: storemind-app
    labels:
      com.storemind.name: 应用
      com.storemind.desc: 网页 + API（8000）
    ports:
      - "8000:8000"
    environment: &app-env
      SM_PG_DSN: ${SM_PG_DSN:-postgresql://storemind:storemind@postgres:5432/storemind}
      SM_EMBED_BACKEND: ${SM_EMBED_BACKEND:-ollama}
      SM_EMBED_DIM: ${SM_EMBED_DIM:-1024}
      SM_EMBED_MODEL: ${SM_EMBED_MODEL:-bge-m3}
      SM_LLM_BACKEND: ${SM_LLM_BACKEND:-ollama}
      SM_LLM_MODEL: ${SM_LLM_MODEL:-qwen2.5:7b}
      SM_LLM_TIMEOUT: ${SM_LLM_TIMEOUT:-60}
      # 走 compose 内部网络。要退回零依赖模式：
      #   SM_EMBED_BACKEND=hashing SM_EMBED_DIM=512 SM_LLM_BACKEND=none docker compose up -d
      SM_OLLAMA_BASE: ${SM_OLLAMA_BASE:-http://ollama:11434}
    extra_hosts:
      # 让容器内的 host.docker.internal 指向宿主机（Linux 上需要显式声明）
      - "host.docker.internal:host-gateway"
    volumes:
      - ../corpus:/app/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  # 同一个镜像，换个入口：MCP server 走 HTTP，供任意 MCP 客户端或 curl 调用。
  # 等 app 建完索引再起，避免两个进程同时初始化数据库。
  mcp:
    image: storemind:local
    container_name: storemind-mcp
    labels:
      com.storemind.name: 接口
      com.storemind.desc: MCP server（8765）
    command: ["python", "scripts/mcp_server.py", "--http", "8765", "--host", "0.0.0.0"]
    ports:
      - "8765:8765"
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../corpus:/app/corpus:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # pgvector：知识库向量和经营数据都在这里。
  # 不再用 profile：docker compose up 就是完整部署，不需要额外记参数。
  postgres:
    image: pgvector/pgvector:pg17
    container_name: storemind-pg
    labels:
      com.storemind.name: 数据库
      com.storemind.desc: PostgreSQL + pgvector（5433）
    environment:
      POSTGRES_USER: storemind
      POSTGRES_PASSWORD: storemind
      POSTGRES_DB: storemind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storemind -d storemind"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  # 模型权重。独立于镜像和宿主机目录，重建容器不用重新下载。
  ollama_models:
