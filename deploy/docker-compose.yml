services:
  # 默认配置是零依赖：不需要 ollama、不需要 GPU，clone 下来 up 就能问答。
  # 要接宿主机上的本地模型：
  #   PowerShell: $env:SM_EMBED_BACKEND="ollama"; $env:SM_LLM_BACKEND="ollama"; docker compose up -d
  #   bash:       SM_EMBED_BACKEND=ollama SM_LLM_BACKEND=ollama docker compose up -d
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: storemind:local
    container_name: storemind-app
    labels:
      com.storemind.name: 应用
      com.storemind.desc: 网页 + API（8000）
    ports:
      - "8000:8000"
    environment: &app-env
      SM_PG_DSN: ${SM_PG_DSN:-postgresql://storemind:storemind@postgres:5432/storemind}
      SM_EMBED_BACKEND: ${SM_EMBED_BACKEND:-hashing}
      SM_EMBED_DIM: ${SM_EMBED_DIM:-512}
      SM_EMBED_MODEL: ${SM_EMBED_MODEL:-bge-m3}
      SM_LLM_BACKEND: ${SM_LLM_BACKEND:-none}
      SM_LLM_MODEL: ${SM_LLM_MODEL:-qwen2.5:7b}
      SM_LLM_TIMEOUT: ${SM_LLM_TIMEOUT:-60}
      SM_OLLAMA_BASE: ${SM_OLLAMA_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      # 让容器内的 host.docker.internal 指向宿主机（Linux 上需要显式声明）
      - "host.docker.internal:host-gateway"
    volumes:
      - ../corpus:/app/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 同一个镜像，换个入口：MCP server 走 HTTP，供任意 MCP 客户端或 curl 调用。
  # 等 app 建完索引再起，避免两个进程同时初始化数据库。
  mcp:
    image: storemind:local
    container_name: storemind-mcp
    labels:
      com.storemind.name: 接口
      com.storemind.desc: MCP server（8765）
    command: ["python", "scripts/mcp_server.py", "--http", "8765", "--host", "0.0.0.0"]
    ports:
      - "8765:8765"
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../corpus:/app/corpus:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # pgvector：知识库向量和经营数据都在这里。
  # 不再用 profile：docker compose up 就是完整部署，不需要额外记参数。
  postgres:
    image: pgvector/pgvector:pg17
    container_name: storemind-pg
    labels:
      com.storemind.name: 数据库
      com.storemind.desc: PostgreSQL + pgvector（5433）
    environment:
      POSTGRES_USER: storemind
      POSTGRES_PASSWORD: storemind
      POSTGRES_DB: storemind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storemind -d storemind"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
