# Ollama 作为 Compose 服务：本地模型也放进 Docker。
#
# 用法（中文快捷脚本会替你拼好）：
#   .\scripts\docker.ps1 启动模型
# 或者手动：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ollama.yml up -d --build
#
# 说明：
# - 容器内地址是 http://ollama:11434；宿主端口映射到 11435，避免和宿主机上已有的
#   ollama（11434）冲突。
# - 首次启动会拉 bge-m3（约 1.2GB）和 qwen2.5:7b（约 4.7GB）到命名卷 ollama-models，
#   需要网络；之后再启动会复用。
# - 如果 Docker Desktop 的 WSL2 已启用 GPU，可以取消 ollama 的 gpus 注释；否则走 CPU
#   （qwen2.5:7b 会明显慢）。

services:
  ollama:
    image: ollama/ollama:latest
    container_name: storemind-ollama
    labels:
      com.storemind.name: 模型服务
      com.storemind.desc: Ollama（bge-m3 / qwen2.5:7b）
    ports:
      - "11435:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped
    # GPU（Docker Desktop WSL2 支持时再打开）：
    # gpus: all

  # 一次性任务：等 ollama 健康后把两个模型拉进卷里。
  # app 会等它成功退出再启动，避免 build_index 时模型还没就绪。
  ollama-init:
    image: ollama/ollama:latest
    container_name: storemind-ollama-init
    labels:
      com.storemind.name: 模型初始化
      com.storemind.desc: 拉取 bge-m3 / qwen2.5:7b
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull bge-m3 && ollama pull qwen2.5:7b"]
    restart: "no"

  app:
    environment:
      SM_OLLAMA_BASE: http://ollama:11434
      SM_EMBED_BACKEND: ollama
      SM_LLM_BACKEND: ollama
      SM_EMBED_DIM: 1024
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  mcp:
    environment:
      SM_OLLAMA_BASE: http://ollama:11434
      SM_EMBED_BACKEND: ollama
      SM_LLM_BACKEND: ollama
      SM_EMBED_DIM: 1024

volumes:
  ollama-models:
